[project]
name = "truelinks"
version = "0.1.0"
description = "Lease and property-issue agents for a property owner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pydantic-ai-slim[openai]>=2.54",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truelinks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
