name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Builds the images and checks browser -> web -> api -> Postgres end to end.
  docker:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: stub
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/api/units
      - if: failure()
        run: docker compose logs
